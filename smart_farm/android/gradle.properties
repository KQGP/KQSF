org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# The pub cache lives on C:\Users\...\AppData\Local\Pub\Cache while this project
# is on D:. Kotlin's incremental compiler stores source paths relative to the
# project root, and cannot do that across drive roots, so building the
# nsd_android plugin fails with:
#   IllegalArgumentException: this and base files have different roots
# Turning incremental compilation off makes it skip the caches entirely. Builds
# are marginally slower; nothing else changes. Remove this if the project and
# the pub cache ever end up on the same drive.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
